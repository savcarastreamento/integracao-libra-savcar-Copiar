el.", "MARIA • COOPERATIVA", "É cooperada e participa de uma organização coletiva; eventual operação de seguros depende do enquadramento próprio.", "PEDRO • ASSOCIAÇÃO", "Adere ao grupo mutualista, aceita regras e contribui para despesas compartilhadas conforme o programa."], "kind": "intro"}, {"lines": ["INTRODUÇÃO", "Onde entra a LIBRA?", "Da adesão ao atendimento: o caminho precisa estar claro para o associado.", "1 • FILIAÇÃO", "O associado aceita o estatuto, o termo de filiação e o regulamento.", "2 • PARTICIPAÇÃO", "Contribui segundo as regras do programa mutualista.", "3 • OCORRÊNCIA", "O evento é comunicado, documentado e analisado.", "4 • DECISÃO", "A concessão do benefício depende do plano, das condições e das exclusões aplicáveis.", "5 • CONFORMIDADE", "LC 213/2025: validar exigências atuais e a situação específica da entidade com o jurídico."], "kind": "intro"}, {"lines": ["TREINAMENTO • LIBRA + SAVCAR", "Quem é quem? Modelos diferentes", "Natureza jurídica, atividade e forma de expansão não são sinônimos.", "Material didático • verificar regras vigentes e acessos antes de divulgar", "Seguradora", "Empresa autorizada a operar seguros, sujeita às regras próprias do setor.", "Associação mutualista", "Organização associativa que compartilha riscos e despesas conforme regras de seu grupo.", "Cooperativa", "Sociedade de pessoas, com regime cooperativista e governança própria.", "Franqueado", "Pessoa ou empresa que explora uma marca e modelo de negócio por contrato de franquia."], "kind": "intro"}, {"lines": ["TREINAMENTO • LIBRA + SAVCAR", "Franquia não é categoria de proteção", "Uma franquia descreve como um negócio se expande — não o benefício oferecido.", "Material didático • verificar regras vigentes e acessos antes de divulgar", "Franqueador x franqueado", "Franqueador: licencia marca e modelo de operação.\nFranqueado: opera a unidade mediante contrato e condições pactuadas.", "Não confundir", "Franqueado ≠ seguradora.\nCooperativa ≠ associação.\nPrestad
